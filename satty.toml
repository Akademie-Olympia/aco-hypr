# Loaded explicitly by screenshot.sh; independent of other Satty profiles.
[general]
initial-tool = "arrow"
copy-command = "wl-copy --type image/png"
save-after-copy = true
early-exit = ["all"]
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
corner-roundness = 0
default-hide-toolbars = false
no-window-decoration = true

[font]
family = "sans-serif"
style = "Regular"

# Catppuccin Mocha, matching the desktop. The numbers 1-8 select the colour.
[color-palette]
palette = ["#f38ba8", "#fab387", "#f9e2af", "#a6e3a1", "#94e2d5", "#89b4fa", "#cba6f7", "#cdd6f4"]
