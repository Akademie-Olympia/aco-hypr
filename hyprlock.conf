# ============================================================================
# HYPRLOCK - ACO lock screen
# Colours and fonts come from aco-theme (~/.config/aco/theme/hypr/hyprlock.conf).
# ============================================================================
source = ~/.config/aco/theme/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = settle, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, settle
    animation = fadeOut, 1, 3, settle
    animation = inputFieldDots, 1, 2, settle
}

# The frozen desktop, blurred and dimmed, keeps the context without showing it.
background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 10
    brightness = 0.6
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:30000] date +%H:%M
    color = $text
    font_size = 88
    font_family = $ui_font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date "+%A, %-d. %B"
    color = $subtext
    font_size = 17
    font_family = $ui_font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 13
    font_family = $ui_font
    position = 0, -70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 40
    rounding = $radius
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $border
    inner_color = $surface
    font_color = $text
    font_family = $ui_font
    check_color = $accent
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = Passwort
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    shadow_passes = 2
    shadow_size = 6
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  Gesperrt
    color = $muted
    font_size = 11
    font_family = $ui_font
    position = 0, 40
    halign = center
    valign = bottom
}
