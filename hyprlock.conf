# ============================================================================
# HYPRLOCK - ACO lock screen, in the spirit of macOS
# The wallpaper, slightly dimmed; date and a large clock at the top; name and a
# slim password field at the bottom. Text is always light (see $lock_fg).
# Colours and fonts come from aco-theme (~/.config/aco/theme/hypr/hyprlock.conf);
# the wallpaper link is kept up to date by wallpaper.sh.
# ============================================================================
source = ~/.config/aco/theme/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = settle, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, settle
    animation = fadeOut, 1, 3, settle
    animation = inputFieldDots, 1, 2, settle
}

# The current wallpaper (falls back to the background colour without one).
background {
    monitor =
    path = ~/.cache/aco/wallpaper/current
    color = $bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.72
    vibrancy = 0.12
}

# Date above the clock, as on a Mac.
label {
    monitor =
    text = cmd[update:60000] date "+%A, %-d. %B"
    color = $lock_fg_soft
    font_size = 20
    font_family = $ui_font
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:15000] echo "<span font_weight='600'>$(date +%H:%M)</span>"
    color = $lock_fg
    font_size = 104
    font_family = $ui_font
    position = 0, -120
    halign = center
    valign = top
}

# User name and password field at the bottom.
label {
    monitor =
    text = cmd[update:0] name=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "${name:-$USER}"
    color = $lock_fg
    font_size = 14
    font_family = $ui_font
    position = 0, 128
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 220, 34
    rounding = -1
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = $lock_field_line
    inner_color = $lock_field
    font_color = $lock_fg
    font_family = $ui_font
    check_color = $accent
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = Passwort eingeben
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Enter zum Entsperren
    color = $lock_fg_soft
    font_size = 11
    font_family = $ui_font
    position = 0, 50
    halign = center
    valign = bottom
}
